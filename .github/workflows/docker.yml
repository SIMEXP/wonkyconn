on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["*"]
    paths:
      - "Dockerfile"
      - "pixi.lock"
      - ".github/workflows/docker.yml"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  docker-build:
    runs-on: self-hosted
    steps:
      - name: Set up environment
        run: |
          git config --global user.name "halfpipe"
          git config --global user.email "halfpipe@fmri.science"
          git config --global datalad.runtime.max-annex-jobs "$(nproc)"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476
        with:
          condarc: |
            channels:
              - conda-forge
          environment-name: datalad
          create-args: >-
            datalad
          cache-environment: true
          init-shell: bash

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: halfpipe/wonkyconn
          tags: |
            type=edge,branch=main
            type=pep440,pattern={{version}}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        id: buildx
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: wonky:conn
          load: true
      # Always use light mode for testing container since the full version was tested during build
      - run: |
          datalad get data/halfpipe data/atlases
          docker run --rm \
            --mount="type=bind,source=${{ github.workspace }},target=${{ github.workspace }}" \
            --workdir="${{ github.workspace }}" \
            wonky:conn \
            --phenotypes data/halfpipe/participants.tsv \
            --atlas Schaefer2018Combined data/atlases/atlas-Schaefer2018Combined_dseg.nii.gz \
            --light-mode \
            data/halfpipe test group

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        # PRs from forks don't have access to secrets, disable this step in that case.
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        if: github.event_name != 'pull_request'
        with:
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
